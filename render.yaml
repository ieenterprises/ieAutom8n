services:
  - type: web
    name: ieautom8n
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: oregon
    disk:
      name: ieautom8n-data
      mountPath: /home/node/.n8n
      sizeGB: 10
    envVars:
      - key: PORT
        value: "5678"
      - key: N8N_PORT
        value: "5678"
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
      - key: N8N_DEFAULT_BINARY_DATA_MODE
        value: "filesystem"
      - key: EXECUTIONS_DATA_PRUNE
        value: "true"
      - key: EXECUTIONS_DATA_MAX_AGE
        value: "168"
      - key: EXTERNAL_FRONTEND_HOOKS_URLS
        value: "/static/branding.js"
