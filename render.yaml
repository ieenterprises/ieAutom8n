services:
  - type: web
    name: ieautom8n
    env: image
    image:
      url: ghcr.io/ieenterprises/ieautom8n:main
    plan: starter
    region: oregon
    disk:
      name: ieautom8n-data
      mountPath: /home/node/.n8n
      sizeGB: 10
    envVars:
      - key: PORT
        value: "5678"
      - key: N8N_PORT
        value: "5678"
      - key: N8N_PROXY_HOPS
        value: "1"
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
      - key: N8N_DEFAULT_BINARY_DATA_MODE
        value: "filesystem"
      - key: EXECUTIONS_DATA_PRUNE
        value: "true"
      - key: EXECUTIONS_DATA_MAX_AGE
        value: "168"
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_HOST
        fromDatabase:
          name: ieautom8n-db
          property: host
      - key: DB_POSTGRESDB_PORT
        fromDatabase:
          name: ieautom8n-db
          property: port
      - key: DB_POSTGRESDB_DATABASE
        fromDatabase:
          name: ieautom8n-db
          property: database
      - key: DB_POSTGRESDB_USER
        fromDatabase:
          name: ieautom8n-db
          property: user
      - key: DB_POSTGRESDB_PASSWORD
        fromDatabase:
          name: ieautom8n-db
          property: password
      - key: DB_POSTGRESDB_SSL_ENABLED
        value: "true"
      - key: DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED
        value: "false"

databases:
  - name: ieautom8n-db
    databaseName: ieautom8n
    user: ieautom8n
    plan: free
    region: oregon
