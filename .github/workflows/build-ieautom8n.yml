name: Build and Publish ieAutom8n

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build & Publish Custom ieAutom8n
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Application Packages
        run: pnpm build

      - name: Prepare Production Deployment
        run: node scripts/build-n8n.mjs

      - name: Build and Push Docker Image
        run: |
          # Lowercase the repository owner for docker image naming
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          export IMAGE_BASE_NAME="ghcr.io/${OWNER}/ieautom8n"
          export IMAGE_TAG="latest"
          docker buildx bake --push n8n
