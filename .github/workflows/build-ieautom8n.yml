name: Build and Publish ieAutom8n

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build & Publish Custom ieAutom8n
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: '--max-old-space-size=7168'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js, pnpm, and Build Monorepo
        uses: ./.github/actions/setup-nodejs
        with:
          build-command: pnpm build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Production Deployment
        run: node scripts/build-n8n.mjs

      - name: Build and Push Docker Image
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          export IMAGE_BASE_NAME="ghcr.io/${OWNER}/ieautom8n"
          export IMAGE_TAG="latest"
          docker buildx bake -f docker/docker-bake.hcl --push n8n
